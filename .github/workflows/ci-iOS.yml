name: ci-iOS

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Xcode
        run: |
          bin/setup-xcode.sh

      - name: Preboot Simulator
        env:
          SIMULATOR_UDID: "5C0769E6-AA2A-4A6D-BEFE-51F39409AA50"
        run: |
          bin/preboot-simulator.sh

      - name: Build and test
        env:
          SCHEME: "CI-iOS"
          PLATFORM_DESTINATION: "platform=iOS Simulator,arch=arm64,id=5C0769E6-AA2A-4A6D-BEFE-51F39409AA50"
          TARGET_SDK: "iphonesimulator"
        run: |
          bin/build-and-test.sh