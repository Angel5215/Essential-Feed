name: ci-iOS

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Xcode
        run: |
          bin/setup-xcode.sh

      - name: Preboot Simulator
        env:
          SIMULATOR_RUNTIME: "26-4"
          SIMULATOR_NAME: "iPhone 17"
        run: |
          bin/preboot-simulator.sh

      - name: Build and test
        env:
          SCHEME: "CI-iOS"
          PLATFORM_DESTINATION: "platform=iOS Simulator,arch=arm64,OS=26.4.1,name=iPhone 17"
          TARGET_SDK: "iphonesimulator"
        run: |
          bin/build-and-test.sh