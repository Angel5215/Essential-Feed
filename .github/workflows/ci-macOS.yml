name: ci-macOS

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 5

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Xcode
        run: |
          bin/setup-xcode.sh

      - name: Build and test
        env:
          SCHEME: "CI-macOS"
          PLATFORM_DESTINATION: "platform=macOS,arch=arm64,name=My Mac"
          TARGET_SDK: "macosx"
        run: |
          bin/build-and-test.sh
