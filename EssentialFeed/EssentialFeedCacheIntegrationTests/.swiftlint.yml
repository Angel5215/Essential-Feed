disabled_rules:
  - file_length
  - force_cast
  - force_try
  - force_unwrapping
  - identifier_name
  - implicitly_unwrapped_optional
  - large_tuple
  - nesting
  - type_body_length

line_length:
  warning: 180
  ignores_comments: true
  ignores_urls: true
  excluded_lines_patterns:
    - '^\s*(\w+:\s*)?"[^"\\]*(\\.[^"\\]*)*"[,)]*\s*$'
